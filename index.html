<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>재고한눈에 — SOBUMO 소모품 부족 모니터링</title>
<meta name="description" content="병의원 소모품·의약품 재고, 입고, 발주, 매입을 직원 모두가 함께 관리하는 무료 서비스. by ALLAI GROUP">
<meta name="theme-color" content="#F7F3EC">
<meta property="og:title" content="재고한눈에 — 재고부터 매입, 발주까지 한눈에">
<meta property="og:description" content="병원 소모품 재고, 이제 실장님 혼자 세지 마세요. 작은 병원은 계속 무료 · 광고 없음">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loading" class="loading">불러오는 중…</div>

<!-- 첫 화면 (우리연차 스타일) -->
<section id="landing" class="landing" hidden>
  <div class="brand">
    <div class="b-eng">SOBUMO</div>
    <h1>재고<span>한눈에</span> <i class="beta">BETA</i></h1>
    <div class="b-sub">소모품 부족 모니터링</div>
    <div class="b-line">재고 · 입고 · 발주 · 매입관리</div>
    <div class="b-by">by ALLAI GROUP</div>
  </div>

  <div class="hero" id="hero">
    <video id="heroV" src="hero.mp4" poster="hero.jpg" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
    <div class="hero-cap" id="heroCap">예전엔, 종이로 하나하나</div>
  </div>

  <div>
    <h2 class="headline">병원 소모품 재고,<br><em>이제 실장님 혼자 세지 마세요</em></h2>
    <p class="lead" style="margin-top:6px">간호사 · 사무장 · 원장님 폰에 똑같이, 실시간으로</p>
    <p class="lead" style="margin-top:2px;font-size:.84rem">🔒 매입 금액은 원장님이 허락한 직원만 볼 수 있어요</p>
  </div>
  <div class="pill">🤝 직원 모두 함께 써요 <b>작은 병원 계속 무료 · 광고 없음</b></div>
  <div id="joinInfo" class="notice" hidden></div>
  <div id="cfgInfo" class="notice" hidden>서비스 준비 중입니다. (관리자: firebase-config.js 설정 필요)</div>
  <button id="startBtn" class="cta">🎁 시작하기 <span>›</span></button>
  <p class="foot-note">ALLAI가 만든 앱에는 광고가 없습니다 ✓</p>
</section>

<!-- 로그인 후 화면들 -->
<main id="screen" hidden></main>
<nav id="tabs" class="tabs" hidden><div class="tabs-in" id="tabsIn"></div></nav>

<script type="module" src="app.js"></script>
</body>
</html>
